# Home Assistant side of frame-art. Created through HA's config API (not by
# editing automations.yaml); kept here as the reviewed record.
#
# Prerequisite: a Local To-do list named "Frame Art uploads"
# (todo.frame_art_uploads). It is the allow-list of TV content ids that HA itself
# uploaded from the frame-art folder; only ids on it are ever deleted.
#
# Why each guard exists:
# - The MQTT broker is anonymous, so anything on the LAN can publish to
#   frame-art/state. The folder is therefore hardcoded here, never read from the
#   payload, and deletes are limited to ids on the allow-list (never Brian's own
#   photos), matching ^MY[_-]F?\d+$, at most 30 per run.
# - art_upload_batch powers on a TV that is fully off. Uploads only run while
#   the TV is already on or in Art Mode, so a 2 AM run never lights the bedroom.
#   Pending work waits for the TV to come on (or the noon retry).
# - art_set_slideshow forces Art Mode, so it is not called here; the slideshow
#   setting persists on the TV and was set once by hand.
# - The samsungtv_smart art services return {"error": ...} instead of raising,
#   so results are checked and reported, not assumed. They are entity services,
#   so HA wraps each response by entity id: {"media_player.<tv>": {...}}.
# - Progress for frame-art's status panel goes out on frame-art/ack as
#   {"sync": {"phase": ...}}: before the batch, before any deletes, and at the
#   end. The batch is one call, so there is no per-file progress inside it. If
#   a run dies part way, "done" never arrives and frame-art says it went quiet.
#   Needs frame-art 0.8.0 or later; older versions ignore these messages, so
#   after a rollback the panel simply shows no progress.
# - The upload step has continue_on_error, so a service-call failure (HA raises
#   rather than returning {"error": ...}) still reaches the error report, the
#   upload ack and "done". The response is pre-set to {} so the defaulting below
#   turns a failed call into {"error": "no response"}.
alias: "Frame Art: sync new art to the bedroom TV"
description: >-
  Uploads new frame-art works to the Master Bedroom Frame TV and deletes retired
  ones, when frame-art reports pending work and the TV is awake. frame-art never
  talks to the TV; this automation is the only path.
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: sensor.frame_art
    not_from: [unavailable, unknown]
    not_to: [unavailable, unknown]
    note: "State is a sequence number that rises when frame-art has new work."
  - trigger: media_player.turned_on
    target:
      entity_id: media_player.master_bedroom_frame_tv
    note: "Retry pending work once the TV is awake."
  - trigger: state
    entity_id: switch.master_bedroom_frame_tv_art_mode
    to: "on"
  - trigger: time
    at: "12:00:00"
    note: "Daily retry in case the TV stayed in Art Mode through a missed trigger."
conditions:
  - condition: state
    entity_id: sensor.frame_art
    attribute: pending
    state: true
  - or:
      - condition: state
        entity_id: media_player.master_bedroom_frame_tv
        attribute: art_mode_status
        state: "on"
      - condition: media_player.is_on
        target:
          entity_id: media_player.master_bedroom_frame_tv
    note: "Never wake a TV that is fully off: art_upload_batch would power it on."
actions:
  - action: mqtt.publish
    data:
      topic: frame-art/ack
      payload: >-
        {{ {'sync': {'phase': 'uploading',
                     'total': state_attr('sensor.frame_art', 'to_upload') | int(0)}} | to_json }}
  - variables:
      batch: {}
  - action: samsungtv_smart.art_upload_batch
    target:
      entity_id: media_player.master_bedroom_frame_tv
    data:
      folder: /config/frame_art_pool/full
      matte_id: none
      throttle: 3
    response_variable: batch
    continue_on_error: true
  - variables:
      up: "{{ batch['media_player.master_bedroom_frame_tv'] | default({'error': 'no response'}) }}"
  - action: mqtt.publish
    data:
      topic: frame-art/ack
      payload: "{{ {'upload': up} | to_json }}"
  - if:
      - "{{ up.error is defined or (up.failed | default([]) | length) > 0 }}"
    then:
      - action: notify.persistent_notification
        data:
          title: Frame Art upload problem
          message: >-
            {% if up.error is defined %}{{ up.error }}{% else %}{{ up.failed | length }}
            file(s) failed to upload: {{ up.failed | join(', ') }}{% endif %}
      - action: notify.mobile_app_pixel_9_pro_xl
        data:
          title: Frame Art upload problem
          message: >-
            {% if up.error is defined %}{{ up.error }}{% else %}{{ up.failed | length }}
            file(s) failed to upload{% endif %}
  - repeat:
      for_each: "{{ up.uploaded | default([]) }}"
      sequence:
        - action: todo.add_item
          target:
            entity_id: todo.frame_art_uploads
          data:
            item: "{{ repeat.item }}"
    note: "Record what HA uploaded: the allow-list for later deletes."
  - action: todo.get_items
    target:
      entity_id: todo.frame_art_uploads
    data:
      status: needs_action
    response_variable: owned
  - variables:
      allowed: "{{ owned['todo.frame_art_uploads']['items'] | map(attribute='summary') | list }}"
      to_delete: >-
        {{ ((state_attr('sensor.frame_art', 'retire') or [])
            | select('in', allowed)
            | select('match', '^MY[_-]F?\\d+$')
            | unique | list)[:30] }}
  - if:
      - "{{ to_delete | length > 0 }}"
    then:
      - action: mqtt.publish
        data:
          topic: frame-art/ack
          payload: "{{ {'sync': {'phase': 'deleting', 'total': to_delete | length}} | to_json }}"
  - repeat:
      for_each: "{{ to_delete }}"
      sequence:
        - variables:
            deleted: {}
        - action: samsungtv_smart.art_delete
          target:
            entity_id: media_player.master_bedroom_frame_tv
          data:
            content_id: "{{ repeat.item }}"
          response_variable: deleted
          continue_on_error: true
        - if:
            - "{{ (deleted['media_player.master_bedroom_frame_tv'] | default({})).success | default(false) }}"
          then:
            - action: todo.remove_item
              target:
                entity_id: todo.frame_art_uploads
              data:
                item: "{{ repeat.item }}"
            - action: mqtt.publish
              data:
                topic: frame-art/ack
                payload: "{{ {'deleted': repeat.item} | to_json }}"
    note: "Only ids HA uploaded itself (on the to-do allow-list) are deleted."
  - action: mqtt.publish
    data:
      topic: frame-art/ack
      payload: "{{ {'sync': {'phase': 'done'}} | to_json }}"
---
# Second automation: tell frame-art what the TV is showing, for the
# "Now showing" page and sensor.frame_art_now_showing. It only reads a sensor
# attribute and publishes over MQTT; it never talks to the TV.
alias: "Frame Art: report what the bedroom TV is showing"
description: >-
  Forwards the Frame TV's current artwork id to frame-art over MQTT, so
  frame-art can look up the title, artist and museum for sensor.frame_art_now_showing.
mode: queued
max: 5
triggers:
  - trigger: state
    entity_id: sensor.master_bedroom_frame_tv_frame_art
    attribute: current_content_id
  - trigger: state
    entity_id: sensor.master_bedroom_frame_tv_frame_art
    attribute: tv_power_state
  - trigger: state
    entity_id: sensor.master_bedroom_frame_tv_frame_art
    attribute: art_mode_status
  - trigger: homeassistant
    event: start
    note: "Re-send after a restart; the TV may have moved on meanwhile."
  - trigger: state
    entity_id: sensor.frame_art
    from: unavailable
    note: "frame-art restarted: re-send, since its retained copy may be stale."
conditions:
  - "{{ state_attr('sensor.master_bedroom_frame_tv_frame_art', 'current_content_id') not in (none, '') }}"
actions:
  - action: mqtt.publish
    data:
      topic: frame-art/current
      retain: true
      payload: >-
        {% set s = 'sensor.master_bedroom_frame_tv_frame_art' %}
        {% set p = state_attr(s, 'tv_power_state') %}
        {% set a = state_attr(s, 'art_mode_status') %}
        {# null when HA doesn't know, so frame-art can tell that from "off" #}
        {{ {'content_id': state_attr(s, 'current_content_id'),
            'on': none if p is none and a is none else (p == 'on' or a == 'on')}
           | to_json }}
---
# Third automation: the TV buttons on frame-art's overview page. frame-art only
# publishes a request on frame-art/command; this automation decides whether and
# how to act, and answers on frame-art/ack with the request's id.
#
# Guards:
# - The broker is anonymous, so the payload is untrusted: only the three known
#   actions and the six slideshow presets are accepted, and nothing else from
#   the payload (no folder, content id or category) is used.
# - Nothing runs while the TV is fully off, so a button never wakes it. While
#   it is on, "mine" and "samsung" switch it to Art Mode (art_set_slideshow
#   does that itself).
# - Selecting a picture by hand switches the TV's slideshow off, so the
#   slideshow is set again after art_select_image. The first call is still
#   needed: it is what puts the TV in Art Mode before the picture is chosen.
# - "upload" only runs the sync automation, with its own conditions, and only
#   while that automation is turned on.
# - "mine" shows a work from the allow-list, i.e. something HA uploaded from
#   frame-art; "samsung" shows one of the TV's Favourites (the Samsung pieces).
alias: "Frame Art: carry out TV requests from the web UI"
description: >-
  Handles the TV buttons on frame-art's overview page: upload pending works now,
  show frame-art's works (My Photos), or go back to the Samsung art
  (Favourites), with the slideshow interval set in frame-art. Never wakes a TV
  that is fully off.
mode: queued
max: 3
triggers:
  - trigger: mqtt
    topic: frame-art/command
variables:
  tv: media_player.master_bedroom_frame_tv
  req: "{{ trigger.payload_json if trigger.payload_json is defined and trigger.payload_json is mapping else {} }}"
  request_id: "{{ req.id | default(none) }}"
  request: "{{ req.action | default('') }}"
  duration: "{{ req.duration | default('1h') }}"
  problem: >-
    {% if request not in ['upload', 'mine', 'samsung'] %}Unknown request
    {% elif duration not in ['3min', '15min', '1h', '12h', '1d', '7d'] %}Unknown slideshow interval
    {% elif not (is_state(tv, 'on') or is_state_attr(tv, 'art_mode_status', 'on')) %}The TV is off; turn it on and try again
    {% elif request == 'upload' and not is_state('automation.frame_art_sync_new_art_to_the_bedroom_tv', 'on') %}Uploads are turned off in Home Assistant
    {% elif request == 'upload' and not is_state_attr('sensor.frame_art', 'pending', true) %}Nothing waiting to upload
    {% endif %}
  # Declared here so the steps below update them rather than shadow them.
  choices: []
  picked: {}
  result: {}
actions:
  - if:
      - "{{ problem | trim | length > 0 }}"
    then:
      - action: mqtt.publish
        data:
          topic: frame-art/ack
          payload: "{{ {'command': {'id': request_id, 'error': problem | trim}} | to_json }}"
      - stop: "Refused"
  - choose:
      - conditions: "{{ request == 'upload' }}"
        sequence:
          - action: automation.trigger
            target:
              entity_id: automation.frame_art_sync_new_art_to_the_bedroom_tv
            data:
              skip_condition: false
    default:
      - action: samsungtv_smart.art_set_slideshow
        target:
          entity_id: media_player.master_bedroom_frame_tv
        data:
          duration: "{{ duration }}"
          shuffle: true
          category_id: "{{ 2 if request == 'mine' else 4 }}"
        response_variable: slideshow
      - if:
          - "{{ request == 'mine' }}"
        then:
          - action: todo.get_items
            target:
              entity_id: todo.frame_art_uploads
            data:
              status: needs_action
            response_variable: owned
          - variables:
              choices: >-
                {{ owned['todo.frame_art_uploads']['items'] | map(attribute='summary')
                   | select('match', '^MY[_-]F?\d+$') | list }}
        else:
          - action: samsungtv_smart.art_available
            target:
              entity_id: media_player.master_bedroom_frame_tv
            data:
              category_id: MY-C0004
            response_variable: favourites
          - variables:
              choices: >-
                {{ (favourites['media_player.master_bedroom_frame_tv'].artwork | default([]))
                   | map(attribute='content_id') | list }}
      - if:
          - "{{ choices | length > 0 }}"
        then:
          - action: samsungtv_smart.art_select_image
            target:
              entity_id: media_player.master_bedroom_frame_tv
            data:
              content_id: "{{ choices | random }}"
            note: "The TV is already awake and in Art Mode (art_set_slideshow saw to it)."
            response_variable: picked
          - action: samsungtv_smart.art_set_slideshow
            target:
              entity_id: media_player.master_bedroom_frame_tv
            data:
              duration: "{{ duration }}"
              shuffle: true
              category_id: "{{ 2 if request == 'mine' else 4 }}"
            response_variable: slideshow
            note: "Picking a picture turns the TV's slideshow off, so turn it back on."
      - variables:
          result: >-
            {% set s = slideshow[tv] | default({'error': 'no response'}) %}
            {% set p = picked[tv] | default({}) %}
            {% if s.error is defined %}{{ {'error': 'Slideshow: ' ~ s.error} }}
            {% elif not choices %}{{ {'error': 'Nothing to show yet: no works uploaded' if request == 'mine' else 'No Favourites on the TV'} }}
            {% elif p.error is defined %}{{ {'error': 'Picture: ' ~ p.error} }}
            {% else %}{{ {} }}{% endif %}
  - action: mqtt.publish
    data:
      topic: frame-art/ack
      payload: >-
        {% set c = {'id': request_id, 'ok': result.error is not defined} %}
        {% if result.error is defined %}{% set c = {'id': request_id, 'ok': false, 'error': result.error} %}{% endif %}
        {{ {'command': c} | to_json }}
---
# Fourth automation: tell frame-art whether uploads are turned on, so the
# "Upload new works now" button can say up front that nothing will happen.
# Retained, so frame-art learns it on every (re)connect. Read-only: it reports
# the sync automation's on/off state and changes nothing. Trigger it once by
# hand after creating it. Nothing clears the retained value if this or the sync
# automation is deleted or renamed, so frame-art treats it as "last known": it
# warns, but the button still asks HA, whose answer is authoritative.
alias: "Frame Art: report whether uploads are on"
id: frame_art_uploads_enabled
mode: queued
max: 3
triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: automation.frame_art_sync_new_art_to_the_bedroom_tv
    to:
      - "on"
      - "off"
actions:
  - action: mqtt.publish
    data:
      topic: frame-art/uploads
      retain: true
      payload: >-
        {{ {'enabled': is_state('automation.frame_art_sync_new_art_to_the_bedroom_tv', 'on')} | to_json }}
