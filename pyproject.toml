[project]
name = "frame-art"
version = "0.2.0"
description = "Public-domain art for a Samsung Frame TV, published for Home Assistant to upload"
readme = "README.md"
authors = [
    { name = "bbaldino", email = "bbaldino@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "paho-mqtt>=2.1.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "starlette>=1.10.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
frame-art = "frame_art:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.1",
]

