[project]
name = "frame-art"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bbaldino", email = "bbaldino@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
frame-art = "frame_art:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
